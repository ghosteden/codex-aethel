<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Codex Aethel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Spectral:ital,wght@0,300;1,400&display=swap">
<style>
:root{--bg:#DFE4E1;--surf:#EFF2F0;--line:#BAC4C0;--ink:#141A19;--ink2:#3E4A47;
  --ink3:#68756F;--acc:#0B6E60;--alert:#A32B26}
@media(prefers-color-scheme:dark){:root{--bg:#080D0C;--surf:#101817;--line:#27332F;
  --ink:#CFDBD7;--ink2:#9AAAA5;--ink3:#6E7E79;--acc:#3FE0C8;--alert:#E85049}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;
  background:var(--bg);color:var(--ink);
  font-family:"Spectral",Georgia,serif;font-size:17px;line-height:1.6}
.box{width:100%;max-width:26rem}
.eyebrow{font-family:"Chakra Petch",system-ui,sans-serif;font-size:10.5px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--acc);margin-bottom:.5rem}
h1{font-family:"Chakra Petch",system-ui,sans-serif;font-size:30px;font-weight:700;
  margin:0 0 .7rem;letter-spacing:-.005em}
p{margin:0 0 1.3rem;color:var(--ink2);font-style:italic}
form{display:flex;gap:.5rem;flex-wrap:wrap}
input{flex:1;min-width:11rem;padding:.62rem .75rem;font-family:inherit;font-size:16px;
  background:var(--surf);color:var(--ink);border:1px solid var(--line);border-radius:3px}
input:focus{outline:2px solid var(--acc);outline-offset:2px}
button{font-family:"Chakra Petch",system-ui,sans-serif;font-size:13px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;padding:.62rem 1.1rem;cursor:pointer;
  background:var(--acc);color:var(--bg);border:1px solid var(--acc);border-radius:3px}
button:disabled{opacity:.55;cursor:default}
#msg{margin:.9rem 0 0;font-size:14px;font-style:normal;min-height:1.3em}
#msg.err{color:var(--alert)}
.tiny{margin-top:1.8rem;font-size:12.5px;font-style:normal;color:var(--ink3);line-height:1.5}
</style>
</head>
<body>
<div class="box">
  <div class="eyebrow">Projet WON</div>
  <h1>Codex Aethel</h1>
  <p>Ce document est chiffr&eacute;. Sans le mot de passe, cette page ne contient rien.</p>
  <form id="f">
    <input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password" autofocus>
    <button id="go" type="submit">Ouvrir</button>
  </form>
  <p id="msg"></p>
  <p class="tiny">D&eacute;chiffrement AES-256-GCM dans votre navigateur.
     Le mot de passe n'est envoy&eacute; nulle part.</p>
</div>
<script>
var ITER=250000;
var f=document.getElementById("f"),pw=document.getElementById("pw"),
    go=document.getElementById("go"),msg=document.getElementById("msg");
function say(t,err){msg.textContent=t;msg.className=err?"err":""}
f.addEventListener("submit",function(e){e.preventDefault();open_(pw.value)});
async function open_(pass){
  if(!pass)return say("Entre le mot de passe.",true);
  if(!(window.crypto&&crypto.subtle))
    return say("Ce navigateur ne peut pas d\u00e9chiffrer la page (HTTPS requis).",true);
  go.disabled=true;say("D\u00e9chiffrement\u2026",false);
  try{
    var r=await fetch("payload.bin",{cache:"force-cache"});
    if(!r.ok)throw new Error("payload");
    var b=new Uint8Array(await r.arrayBuffer());
    var salt=b.slice(0,16),iv=b.slice(16,28),body=b.slice(28);
    var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),
              "PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey(
              {name:"PBKDF2",salt:salt,iterations:ITER,hash:"SHA-256"},
              base,{name:"AES-GCM",length:256},false,["decrypt"]);
    var gz=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,body);
    var html;
    if(typeof DecompressionStream!=="undefined"){
      var st=new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"));
      html=await new Response(st).text();
    }else{ throw new Error("nogzip") }
    document.open();document.write(html);document.close();
  }catch(err){
    go.disabled=false;
    say(err&&err.message==="payload"?"Fichier introuvable sur le serveur."
       :err&&err.message==="nogzip"?"Navigateur trop ancien pour ouvrir ce document."
       :"Mot de passe incorrect.",true);
    pw.select();
  }
}
</script>
</body>
</html>
